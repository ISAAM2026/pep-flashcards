<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>人教版 PEP 三年级上册 · 单词卡片</title>
<style>
  :root{
    --green:#14513a;        /* 主色 墨绿 */
    --green-2:#1f7a5a;
    --green-soft:#e7f1ec;
    --green-line:#bfe0d2;
    --ink:#1f2a24;
    --paper:#f4faf6;
    --card:#ffffff;
    --muted:#5d7068;
    --shadow:0 10px 30px rgba(20,81,58,.15);
    --seg1:#1f7a5a; --seg2:#c9762b; --seg3:#7a4fb0; --seg4:#2b6fb0; --seg5:#b03a6e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:linear-gradient(160deg,#eef7f2 0%,#dcefe6 100%);
    color:var(--ink); min-height:100vh; padding-bottom:40px;
  }
  header.top{
    background:var(--green); color:#fff; padding:18px 20px 14px;
    box-shadow:0 4px 14px rgba(20,81,58,.25);
  }
  header.top h1{margin:0; font-size:20px; letter-spacing:1px; font-weight:700;}
  header.top p{margin:4px 0 0; font-size:12.5px; opacity:.85;}
  .wrap{max-width:880px; margin:0 auto; padding:16px;}
  /* unit tabs */
  .tabs{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 14px;}
  .tab{
    border:1.5px solid var(--green-line); background:#fff; color:var(--green);
    padding:8px 14px; border-radius:999px; cursor:pointer; font-size:14px; font-weight:600;
    transition:.15s; user-select:none;
  }
  .tab:hover{background:var(--green-soft);}
  .tab.active{background:var(--green); color:#fff; border-color:var(--green);}
  /* progress */
  .prog-row{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .prog-bar{flex:1; height:14px; background:#d8e9e0; border-radius:999px; overflow:hidden; border:1px solid var(--green-line);}
  .prog-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--green-2),var(--green)); transition:width .35s ease;}
  .prog-label{font-size:13px; color:var(--green); font-weight:700; white-space:nowrap;}
  .mini-btn{
    border:1.5px solid var(--green); background:#fff; color:var(--green);
    padding:7px 12px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
  }
  .mini-btn:hover{background:var(--green-soft);}
  .mini-btn svg{width:15px; height:15px;}
  /* card */
  .stage{display:flex; justify-content:center; perspective:1400px; margin:8px 0 6px;}
  .card{
    width:min(420px,92vw); height:300px; position:relative; cursor:pointer;
    transform-style:preserve-3d; transition:transform .6s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:var(--card); border-radius:20px; box-shadow:var(--shadow);
    border:2px solid var(--green-line); padding:22px; display:flex; flex-direction:column;
  }
  .face.back{transform:rotateY(180deg); overflow:auto;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .icon-btn{
    background:none; border:none; cursor:pointer; padding:4px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center; transition:.15s; color:var(--green);
  }
  .icon-btn:hover{background:var(--green-soft);}
  .icon-btn svg{width:26px; height:26px; display:block;}
  .word-area{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px;}
  .word{font-size:40px; font-weight:800; line-height:1.15; letter-spacing:.5px; display:flex; flex-wrap:wrap; justify-content:center; gap:0 2px;}
  .word .seg{transition:.2s;}
  .word.size-big{font-size:66px;}
  .word.size-small{font-size:24px;}
  .word.size-tall{font-size:40px; line-height:1.05; transform:scaleY(1.45); transform-origin:center;}
  .word.size-fast{transform:skewX(-12deg);}
  .phon{font-size:18px; color:var(--muted); font-style:italic;}
  .hint{font-size:12px; color:#9bb0a6; margin-top:2px;}
  .occ{font-size:12px; color:var(--seg2); font-weight:700; align-self:flex-end;}
  /* back */
  .zh{font-size:30px; font-weight:800; color:var(--green); text-align:center; margin-top:6px;}
  .ex{font-size:16px; color:var(--ink); text-align:center; margin:8px 4px;}
  .ex b{color:var(--green-2);}
  .tips{margin-top:10px; border-top:1px dashed var(--green-line); padding-top:10px;}
  .tip-title{font-size:12px; font-weight:800; color:var(--green-2); letter-spacing:1px; margin-bottom:6px;}
  .tip-block{font-size:13.5px; line-height:1.7; margin-bottom:8px;}
  .tip-block .lab{font-weight:700; color:var(--green);}
  .chip{display:inline-block; background:var(--green-soft); color:var(--green); border-radius:8px; padding:2px 8px; margin:2px 3px; cursor:pointer; font-weight:700; border:1px solid var(--green-line);}
  .chip:hover{background:var(--green); color:#fff;}
  .hl{color:var(--seg2); font-weight:800; font-size:1.18em;}
  .diff{color:#d83a3a; font-weight:800; text-decoration:underline;}
  .shape-tip{font-size:13px; color:var(--muted); background:#fff8ec; border:1px solid #f0d9a8; border-radius:8px; padding:6px 8px;}
  /* controls */
  .controls{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:14px;}
  .btn{
    border:none; cursor:pointer; font-weight:700; font-size:15px; padding:12px 18px; border-radius:14px;
    background:var(--green); color:#fff; box-shadow:0 4px 12px rgba(20,81,58,.25); transition:.15s; display:inline-flex; align-items:center; gap:7px;
  }
  .btn:hover{filter:brightness(1.08); transform:translateY(-1px);}
  .btn svg{width:17px;height:17px;}
  .btn.ghost{background:#fff; color:var(--green); border:1.5px solid var(--green); box-shadow:none;}
  .btn.warn{background:var(--seg2);}
  .btn.ok{background:var(--green-2);}
  .back-controls{display:flex; gap:10px; justify-content:center; margin-top:10px; flex-wrap:wrap;}
  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(15,40,30,.45); display:none; align-items:center; justify-content:center; padding:18px; z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:#fff; border-radius:18px; max-width:560px; width:100%; max-height:86vh; overflow:auto; box-shadow:var(--shadow); padding:20px;}
  .modal h2{margin:0 0 12px; color:var(--green); font-size:18px; display:flex; align-items:center; gap:8px;}
  .modal h2 svg{width:20px;height:20px;}
  .wb-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 10px; border:1px solid var(--green-line); border-radius:12px; margin-bottom:8px; background:var(--paper);}
  .wb-item .w{font-weight:800; font-size:16px; color:var(--ink);}
  .wb-item .p{font-size:12px; color:var(--muted);}
  .wb-item .z{font-size:13px; color:var(--green-2); margin-left:8px;}
  .dots{display:inline-flex; gap:4px; margin-left:8px;}
  .dot{width:9px;height:9px;border-radius:50%; background:#d8e9e0; border:1px solid var(--green-line);}
  .dot.on{background:var(--green-2); border-color:var(--green-2);}
  .rm-btn{border:none; background:#fdecec; color:#c0392b; border-radius:9px; padding:6px 10px; cursor:pointer; font-weight:700; font-size:13px;}
  .rm-btn:hover{background:#f9d6d6;}
  .modal-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .close-x{margin-left:auto; cursor:pointer; color:var(--muted); background:none; border:none; font-size:20px; line-height:1;}
  /* dictation */
  .dict-q{font-size:15px; color:var(--ink); margin:6px 0;}
  .dict-zh{font-size:22px; font-weight:800; color:var(--green);}
  .dict-input{width:100%; font-size:20px; padding:12px; border:2px solid var(--green-line); border-radius:12px; margin:10px 0; text-align:center; letter-spacing:2px;}
  .dict-input:focus{outline:none; border-color:var(--green);}
  .dict-fb{font-size:15px; font-weight:700; min-height:22px; margin-bottom:8px;}
  .dict-fb.ok{color:var(--green-2);}
  .dict-fb.no{color:#c0392b;}
  .dict-score{font-size:13px; color:var(--muted);}
  /* 听写反馈：红框 + 抖动 */
  .dict-input.ok{ border-color:var(--green-2); background:#eafaf1; }
  .dict-input.error{ border-color:#d83a3a !important; background:#fdecec; }
  @keyframes dictShake{
    10%,90%{transform:translateX(-2px);}
    20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-8px);}
    40%,60%{transform:translateX(8px);}
  }
  .dict-input.shake{ animation:dictShake .5s cubic-bezier(.36,.07,.19,.97) both; }
  /* 翻译 */
  .tr-toggle{display:flex; gap:8px; margin:6px 0 12px;}
  .tr-mode{border:1.5px solid var(--green-line); background:#fff; color:var(--green); padding:8px 18px; border-radius:999px; cursor:pointer; font-weight:700; font-size:14px; transition:.15s;}
  .tr-mode:hover{background:var(--green-soft);}
  .tr-mode.active{background:var(--green); color:#fff; border-color:var(--green);}
  .tr-result{margin-top:8px; min-height:30px;}
  .tr-card{background:var(--green-soft); border:1px solid var(--green-line); border-radius:12px; padding:14px; margin-bottom:8px;}
  .tr-w{font-size:22px; font-weight:800; color:var(--green);}
  .tr-p{font-size:14px; color:var(--muted); font-style:italic;}
  .tr-zh{font-size:18px; font-weight:700; margin:6px 0; color:var(--ink);}
  .tr-ex{font-size:14px; color:var(--ink);}
  .tr-note{color:var(--muted); font-size:14px; background:#fff8ec; border:1px solid #f0d9a8; border-radius:10px; padding:10px;}
  .tr-speak{margin-top:8px;}
  /* connect view */
  .grp{margin-bottom:14px;}
  .grp h3{margin:0 0 6px; font-size:14px; color:var(--green-2);}
  .grp .nodes{display:flex; flex-wrap:wrap; gap:8px;}
  .node{background:var(--green-soft); border:1px solid var(--green-line); color:var(--green); border-radius:10px; padding:7px 12px; cursor:pointer; font-weight:700; font-size:14px;}
  .node:hover{background:var(--green); color:#fff;}
  .body-svg{width:100%; max-width:300px; display:block; margin:0 auto;}
  /* toast */
  .toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px); background:var(--green); color:#fff; padding:12px 20px; border-radius:12px; font-weight:700; box-shadow:var(--shadow); opacity:0; transition:.25s; z-index:80; pointer-events:none;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .foot{text-align:center; color:#7c8f86; font-size:12px; margin-top:22px;}
  .legend{font-size:11.5px; color:#8aa39a; text-align:center; margin-top:4px;}

  /* ============ iPad / 平板适配 ============ */
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body{ min-height:100dvh; -webkit-tap-highlight-color:transparent; }
  .card{ -webkit-transform-style:preserve-3d; touch-action:manipulation; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
  .tab,.btn,.mini-btn,.icon-btn,.node,.chip,.tr-mode,.rm-btn,.close-x,.dict-input{
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  /* 触摸设备：避免 hover 粘滞、加大点击热区 */
  @media (hover:none){
    .btn:hover{ transform:none; filter:none; }
  }
  @media (pointer:coarse){
    .tab{ padding:10px 16px; }
    .icon-btn{ padding:9px; }
    .icon-btn svg{ width:30px; height:30px; }
    .btn{ padding:13px 20px; }
    .mini-btn{ padding:10px 14px; }
    .chip,.node{ padding:9px 13px; }
    .close-x{ min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; }
    .rm-btn{ padding:9px 12px; }
  }
  /* iPad 竖屏及以上（≥768px）：卡片与文字整体放大 */
  @media (min-width:768px){
    .wrap{ max-width:960px; padding:22px 24px; }
    header.top{ padding:22px 28px 18px; }
    header.top h1{ font-size:26px; }
    header.top p{ font-size:14px; }
    .tabs{ gap:10px; margin:8px 0 18px; }
    .tab{ font-size:16px; padding:11px 20px; }
    .prog-row{ gap:16px; margin-bottom:18px; }
    .prog-bar{ height:16px; }
    .prog-label{ font-size:15px; }
    .mini-btn{ font-size:14px; }
    .stage{ margin:14px 0 10px; }
    .card{ width:min(560px,86vw); height:410px; }
    .face{ padding:30px; border-radius:24px; }
    .icon-btn svg{ width:30px; height:30px; }
    .word{ font-size:56px; }
    .word.size-big{ font-size:86px; }
    .word.size-small{ font-size:34px; }
    .word.size-tall{ font-size:56px; }
    .phon{ font-size:22px; }
    .hint,.occ{ font-size:14px; }
    .zh{ font-size:38px; }
    .ex{ font-size:19px; margin:12px 6px; }
    .tip-title{ font-size:14px; }
    .tip-block{ font-size:15px; }
    .shape-tip{ font-size:14px; }
    .controls{ gap:12px; margin-top:20px; }
    .btn{ font-size:16px; padding:14px 22px; border-radius:16px; }
    .btn svg{ width:19px; height:19px; }
    .back-controls{ gap:12px; margin-top:14px; }
    .overlay{ padding:24px; }
    .modal{ max-width:680px; padding:24px; max-height:calc(100dvh - 48px); -webkit-overflow-scrolling:touch; }
    .modal h2{ font-size:21px; }
    .dict-q,.dict-fb{ font-size:16px; }
    .dict-zh{ font-size:26px; }
    .dict-input{ font-size:22px; padding:14px; }
    .tr-w{ font-size:26px; }
    .tr-p{ font-size:16px; }
    .tr-zh{ font-size:20px; }
    .tr-ex,.tr-note{ font-size:15px; }
    .tr-mode{ font-size:16px; padding:10px 22px; }
    .wb-item .w{ font-size:18px; }
    .wb-item .p,.wb-item .z,.rm-btn{ font-size:14px; }
    .node,.chip{ font-size:15px; padding:9px 14px; }
    .legend,.foot{ font-size:13px; }
  }
  /* iPad 横屏（高度较矮）：压缩纵向间距，一屏内看全 */
  @media (min-width:1024px) and (orientation:landscape) and (max-height:900px){
    .wrap{ padding-top:10px; padding-bottom:10px; }
    header.top{ padding:12px 24px 10px; }
    header.top h1{ font-size:20px; }
    header.top p{ font-size:12.5px; }
    .tabs{ margin:6px 0 10px; }
    .tab{ padding:8px 16px; font-size:14px; }
    .prog-row{ margin-bottom:10px; }
    .stage{ margin:6px 0 4px; }
    .card{ height:320px; }
    .face{ padding:22px; }
    .word{ font-size:46px; }
    .word.size-big{ font-size:70px; }
    .word.size-small{ font-size:30px; }
    .word.size-tall{ font-size:46px; }
    .zh{ font-size:30px; }
    .ex{ font-size:17px; margin:8px 4px; }
    .controls,.back-controls{ margin-top:10px; }
    .btn{ padding:11px 18px; font-size:15px; }
    .legend,.foot{ margin-top:10px; font-size:12px; }
  }
  /* iPad Pro 圆角 / 底部指示条安全区域 */
  @supports (padding: env(safe-area-inset-left)){
    header.top{ padding-left:max(20px, env(safe-area-inset-left)); padding-right:max(20px, env(safe-area-inset-right)); }
    .wrap{ padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right)); }
  }
</style>
</head>
<body>
<header class="top">
  <h1>人教版 PEP 三年级上册 · 单词卡片</h1>
  <p>点卡片翻转 · 用心形收藏生词 · 用喇叭听读 · 通关后听写</p>
</header>

<div class="wrap">
  <div class="tabs" id="tabs"></div>

  <div class="prog-row">
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
    <div class="prog-label" id="progLabel">已记住 0 / 0</div>
    <button class="mini-btn" id="connectBtn" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M5 8v4h14V8M12 12v4"/></svg>
      串起来看
    </button>
  </div>

  <div class="stage">
    <div class="card" id="card">
      <div class="face front">
        <div class="card-top">
          <button class="icon-btn" id="speakBtn" title="听读">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
          </button>
          <button class="icon-btn" id="heartBtn" title="收藏">
            <svg id="heartSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-9.5-9C1 8 2.5 4.5 6 4.5c2 0 3.2 1.2 4 2.5.8-1.3 2-2.5 4-2.5 3.5 0 5 3.5 3.5 6.5C19 15.5 12 20 12 20z"/></svg>
          </button>
        </div>
        <div class="word-area">
          <div class="word" id="wordEl"></div>
          <div class="phon" id="phonEl"></div>
          <div class="hint">点击卡片 / 翻转卡片 看中文</div>
        </div>
        <div class="occ" id="occEl"></div>
      </div>

      <div class="face back">
        <div class="card-top">
          <button class="icon-btn" id="speakBtn2" title="听读">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
          </button>
          <button class="icon-btn" id="heartBtn2" title="收藏">
            <svg id="heartSvg2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-9.5-9C1 8 2.5 4.5 6 4.5c2 0 3.2 1.2 4 2.5.8-1.3 2-2.5 4-2.5 3.5 0 5 3.5 3.5 6.5C19 15.5 12 20 12 20z"/></svg>
          </button>
        </div>
        <div class="zh" id="zhEl"></div>
        <div class="ex" id="exEl"></div>
        <div class="tips" id="tipsEl"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn ghost" id="flipBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
      翻转卡片
    </button>
    <button class="btn ghost" id="nextBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      随机下一个
    </button>
    <button class="btn ghost" id="wbBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="M4 5l8 6 8-6"/></svg>
      查看生词本
    </button>
    <button class="btn" id="dictBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5"/><path d="M8 13h7M8 16h5"/></svg>
      开始听写
    </button>
    <button class="btn ghost" id="trBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h7"/><path d="M7.5 3v3.5c0 1.4-1.1 2.5-2.5 2.5S2.5 8.4 2.5 7V3"/><path d="M12 20l4-9 4 9"/><path d="M13.2 17h5.6"/></svg>
      翻译工具
    </button>
  </div>

  <div class="back-controls" id="backControls" style="display:none;">
    <button class="btn warn" id="forgetBtn">没记住</button>
    <button class="btn ok" id="rememberBtn">记住了</button>
  </div>

  <div class="legend">提示：正面单词按自然拼读分段用不同颜色显示；颜色词（如 orange）以其本色呈现；big 特大、small 特小、tall 拉高。</div>
  <div class="foot">数据来自课本词汇表（Appendix 2），进度与生词本保存在本机浏览器，刷新不丢失。</div>
</div>

<!-- 生词本 modal -->
<div class="overlay" id="wbOverlay">

// 藏词：本词里藏着另一个课本单词（>=3字母）
function hiddenIn(w){
  const low=w.toLowerCase().replace(/[^a-z]/g,'');
  const found=[];
  WORDS.forEach(x=>{
    const v=x.w.toLowerCase().replace(/[^a-z]/g,'');
    if(v.length>=3 && v!==low && low.includes(v) && !found.includes(v)) found.push(v);
  });
  return found;
}
// 别搞混：同长度、只差一个字母
function confuseWith(w){
  const low=w.toLowerCase().replace(/[^a-z]/g,'');
  const out=[];
  WORDS.forEach(x=>{
    const v=x.w.toLowerCase().replace(/[^a-z]/g,'');
    if(v.length===low.length && v!==low){
      let diff=0; for(let i=0;i<low.length;i++) if(low[i]!==v[i]) diff++;
      if(diff===1) out.push({word:x.w, idx:diffPos(low,v)});
    }
  });
  return out;
}
function diffPos(a,b){ for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return i; return -1; }

// 拼读家族：按字母组合归类
const COMBOS = ["ee","ea","oo","a_e","i_e","ar","ir","ur","ow","ear","sh","th","ck"];
function combosOf(w){
  const low=w.toLowerCase().replace(/[^a-z]/g,'');
  let hits=[];
  if(low.includes("ee")) hits.push("ee");
  if(low.includes("ea")) hits.push("ea");
  if(low.includes("oo")) hits.push("oo");
  if(/a.e/.test(low)) hits.push("a_e");
  if(/i.e/.test(low)) hits.push("i_e");
  if(low.includes("ar")) hits.push("ar");
  if(low.includes("ir")) hits.push("ir");
  if(low.includes("ur")) hits.push("ur");
  if(low.includes("ow")) hits.push("ow");
  if(low.includes("ear")) hits.push("ear");
  if(low.includes("sh")) hits.push("sh");
  if(low.includes("th")) hits.push("th");
  if(low.includes("ck")) hits.push("ck");
  if(hits.includes("ear")) hits = hits.filter(c=>c!=="ar"); // ear 已含 ar，避免并入 ar 家族
  return hits;
}
// 拼读家族：先找字母组合，再对照音标按“相同读音”归一家
function soundOf(ph, combo){
  switch(combo){
    case "ee": return "iː";
    case "ea": if(ph.includes("ɪə")) return "ɪə"; if(ph.includes("iː")) return "iː"; if(ph.includes("e")) return "e"; return "ea";
    case "oo": return ph.includes("ʊ") ? "ʊ" : "uː";
    case "a_e": return ph.includes("eɪ") ? "eɪ" : "a_e_x";
    case "i_e": return ph.includes("aɪ") ? "aɪ" : "i_e_x";
    case "ar": return ph.includes("ɑː") ? "ɑː" : "ar_x";
    case "ir": case "ur": return "ɜː";
    case "ow": return (ph.includes("əʊ")||ph.includes("oʊ")) ? "oʊ" : "aʊ";
    case "ear": return "ɪə";
    case "sh": return "ʃ";
    case "th": return ph.includes("ð") ? "ð" : "θ";
    case "ck": return "k";
  }
  return combo;
}
function famPairs(w){
  if(!(w in byWord)) return [];
  const cs=combosOf(w); if(!cs.length) return [];
  const ph=WORDS[byWord[w]].ph;
  return cs.map(c=>c+"#"+soundOf(ph,c));
}
function familyOf(w){
  const mine=famPairs(w);
  if(!mine.length) return [];
  const fam=new Set();
  WORDS.forEach(x=>{
    if(x.w===w) return;
    const p=famPairs(x.w);
    if(p.some(pp=>mine.includes(pp))) fam.add(x.w);
  });
  return [...fam];
}

function startStudy(){
  selectingIds = unitWords(curUnit);
  const rem = rememberedOf(curUnit===0?0:curUnit);
  // 若选全部，进度按全部记
  studyQueue = shuffle(selectingIds.filter(i=> !rem.has(WORDS[i].w)));
  pendingRetry=[]; normalSinceRetry=0; occMap={};
  flipped=false; $("card").classList.remove("flipped");
  updateBackControls();
  if(studyQueue.length===0){ showWin(false); return; }
  nextCard(true);
  updateProgress();
}

function nextCard(force){
  if(pendingRetry.length && (normalSinceRetry>=3 || studyQueue.length===0)){
    curIdx = pendingRetry.shift();
    normalSinceRetry=0;
    occMap[curIdx]=(occMap[curIdx]||0)+1;
  } else if(studyQueue.length){
    curIdx = studyQueue.shift();
    normalSinceRetry++;
    if(!(curIdx in occMap)) occMap[curIdx]=1;
  } else if(pendingRetry.length){
    curIdx = pendingRetry.shift(); occMap[curIdx]=(occMap[curIdx]||0)+1;
  } else {
    showWin(true); return;
  }
  renderCard();
}

let dictState=null;
$("dictBtn").onclick=()=>startDictation("unit");
function startDictation(mode){
  let pool;
  if(mode==="wb"){ pool=store.wordbook.map(w=>byWord[w]).filter(i=>i!==undefined); if(pool.length===0){ toast("生词本是空的"); return; } }
  else { pool=unitWords(curUnit); }
  pool=shuffle(pool.slice());
  const count = Math.min(10, pool.length);
  dictState={mode, list:pool.slice(0,count), pos:0, score:0};
  $("dictOverlay").classList.add("show");
  renderDict();
}
function renderDict(){
  const b=$("dictBody"); b.innerHTML="";
  const st=dictState;
  if(st.pos>=st.list.length){
    b.innerHTML='<p style="font-size:16px;font-weight:700;color:var(--green)">听写完成！答对 '+st.score+' / '+st.list.length+'</p>'
      +'<p style="color:var(--muted)">'+(st.mode==="wb"?"连续拼对 3 次的词已自动离开生词本。":"拼错的词已加入生词本，可以去复习哦。")+'</p>';
    return;
  }
  const d=WORDS[st.list[st.pos]];
  b.innerHTML='<div class="dict-q">第 '+(st.pos+1)+' / '+st.list.length+' 题 &nbsp; <span class="dict-score">答对 '+st.score+'</span></div>'
    +'<div class="dict-zh">'+d.zh+'</div>';
  const input=document.createElement("input"); input.className="dict-input"; input.placeholder="写出英文（可含空格）"; input.autocomplete="off";
  b.appendChild(input);
  const fb=document.createElement("div"); fb.className="dict-fb"; b.appendChild(fb);
  const row=document.createElement("div"); row.className="modal-actions";
  const sub=document.createElement("button"); sub.className="btn"; sub.textContent="提交";
  const hear=document.createElement("button"); hear.className="btn ghost"; hear.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/></svg> 再听一次';
  row.appendChild(sub); row.appendChild(hear); b.appendChild(row);
  input.focus();
  const check=()=>{
    const ans=input.value.trim().toLowerCase().replace(/\s+/g,' ');
    const corr=d.w.toLowerCase();
    if(ans===corr){
      input.classList.remove("error"); input.classList.add("ok");
      fb.className="dict-fb ok"; fb.textContent="答对啦！"; st.score++;
      dingSound();
      if(st.mode==="wb"){ const p=(store.wbProgress[d.w]||0)+1; store.wbProgress[d.w]=p; if(p>=3){ removeBook(d.w); } saveStore(); }
      sub.disabled=true; input.disabled=true;
      setTimeout(()=>{ st.pos++; renderDict(); }, 850);
    } else {
      input.classList.remove("ok"); input.classList.add("error","shake");
      fb.className="dict-fb no"; fb.textContent="正确答案：" + d.w;
      oopsSound();
      if(st.mode==="wb"){ store.wbProgress[d.w]=0; saveStore(); } else { addBook(d.w); }
      sub.disabled=true; input.disabled=true;
      setTimeout(()=>{ st.pos++; renderDict(); }, 1400);
    }
  };
  sub.onclick=check;
  input.onkeydown=e=>{ if(e.key==="Enter") check(); };
  hear.onclick=()=>speak(d.w);
  speak(d.w);
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function speak(text){
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-US"; u.rate=0.75; u.pitch=1;
    const voices=speechSynthesis.getVoices();
    const en=voices.find(v=>/en[-_]US/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
    if(en) u.voice=en;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

let audioCtx=null;
function getAudio(){
  if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}
// 拼错时的“啊—噢”声：先降后升的两个音
function oopsSound(){
  const ctx=getAudio(); if(!ctx) return;
  const t0=ctx.currentTime;
  const notes=[[440,330,0,0.2],[330,392,0.22,0.42]]; // [起频,落频,起始,结束]
  notes.forEach(([f1,f2,s,e])=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="triangle";
    o.frequency.setValueAtTime(f1,t0+s);
    o.frequency.exponentialRampToValueAtTime(f2,t0+e);
    g.gain.setValueAtTime(0.0001,t0+s);
    g.gain.exponentialRampToValueAtTime(0.28,t0+s+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+e);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0+s); o.stop(t0+e+0.02);
  });
}
// 答对时的轻快“叮”声
function dingSound(){
  const ctx=getAudio(); if(!ctx) return;
  const t0=ctx.currentTime;
  [[880,0,0.12],[1320,0.1,0.22]].forEach(([f,s,e])=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o.frequency.setValueAtTime(f,t0+s);
    g.gain.setValueAtTime(0.0001,t0+s);
    g.gain.exponentialRampToValueAtTime(0.2,t0+s+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+e);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0+s); o.stop(t0+e+0.02);
  });
}

/* ============ 翻译工具（英译汉 / 汉译英） ============ */
let trMode="en2zh";
$("trBtn").onclick=openTranslate;
function openTranslate(){
  // 打开时默认带入当前卡片单词（英译汉方向）
  if(trMode==="en2zh" && curIdx>=0){ $("trInput").value=WORDS[curIdx].w; }
  else { $("trInput").value=""; }
  $("trResult").innerHTML="";
  $("trOverlay").classList.add("show");
  $("trInput").focus();
  if($("trInput").value) trLookup();
}
function setTrMode(mode){
  trMode=mode;
  document.querySelectorAll("#trToggle .tr-mode").forEach(b=> b.classList.toggle("active", b.getAttribute("data-mode")===mode));
  $("trInput").placeholder = (mode==="en2zh") ? "输入英文单词，例如 water" : "输入中文意思，例如 水";
  $("trInput").value=""; $("trResult").innerHTML="";
  $("trInput").focus();
}
document.querySelectorAll("#trToggle .tr-mode").forEach(b=> b.onclick=()=>setTrMode(b.getAttribute("data-mode")));
$("trInput").oninput=trLookup;
$("trInput").onkeydown=e=>{ if(e.key==="Enter") trLookup(); };

function trLookup(){
  const q=$("trInput").value.trim().toLowerCase().replace(/\s+/g,' ');
  const box=$("trResult"); box.innerHTML="";
  if(!q) return;
  if(trMode==="en2zh"){
    const hit=WORDS.find(x=>x.w.toLowerCase()===q);
    if(hit){ box.appendChild(trCard(hit)); }
    else { box.innerHTML='<p class="tr-note">词库里还没收录「'+q+'」哦（翻译基于课本词汇表，共 136 词）。试试课本里的单词吧。</p>'; }
  } else {
    const hits=WORDS.filter(x=> x.zh.includes(q) || x.w.toLowerCase()===q);
    if(hits.length){
      hits.slice(0,15).forEach(h=> box.appendChild(trCard(h)) );
      if(hits.length>15) box.innerHTML+='<p class="tr-note">匹配到 '+hits.length+' 个词，仅显示前 15 个。</p>';
    } else { box.innerHTML='<p class="tr-note">没找到和「'+q+'」对应的词。翻译基于课本词汇表，可换个说法或输入更短的关键字试试。</p>'; }
  }
}
function trCard(d){
  const card=document.createElement("div"); card.className="tr-card";
  const w=document.createElement("div"); w.className="tr-w"; w.textContent=d.w;
  const p=document.createElement("span"); p.className="tr-p"; p.textContent=" /"+d.ph+"/";
  w.appendChild(p);
  const zh=document.createElement("div"); zh.className="tr-zh"; zh.textContent=d.zh;
  const ex=document.createElement("div"); ex.className="tr-ex"; ex.textContent="例句："+d.ex;
  const sp=document.createElement("button"); sp.className="mini-btn tr-speak";
  sp.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/></svg> 听读';
  sp.onclick=()=>speak(d.w);
  card.appendChild(w); card.appendChild(zh); card.appendChild(ex); card.appendChild(sp);
  return card;
}

/* ============ iPad/iOS 音频解锁：首次触摸时激活 Web Audio 与朗读 ============ */
function unlockAudio(){
  getAudio();
  try{ const u=new SpeechSynthesisUtterance(""); speechSynthesis.speak(u); }catch(e){}
}
["touchend","pointerdown","mousedown"].forEach(ev=>
  document.addEventListener(ev, unlockAudio, {once:true, passive:true})
);

buildTabs();
startStudy();
